repos:
  - repo: local
    hooks:
      - id: isort-quri-algo
        name: uv run --no-sync isort (quri-algo)
        entry: uv run --no-sync isort quri-algo
        language: system
        types: [python]
        pass_filenames: false
      - id: isort-quri-parts
        name: uv run --no-sync isort (quri-parts)
        entry: uv run --no-sync isort quri-parts/packages
        language: system
        types: [python]
        pass_filenames: false
      - id: isort-quri-vm
        name: uv run --no-sync isort (quri-vm)
        entry: uv run --no-sync isort quri-vm
        language: system
        types: [python]
        pass_filenames: false
      - id: black-quri-algo
        name: uv run --no-sync black (quri-algo)
        entry: uv run --no-sync black --config .black.toml quri-algo
        language: system
        types: [python]
        pass_filenames: false
      - id: black-quri-parts
        name: uv run --no-sync black (quri-parts)
        entry: uv run --no-sync black --config .black.toml quri-parts/packages
        language: system
        types: [python]
        pass_filenames: false
      - id: black-quri-vm
        name: uv run --no-sync black (quri-vm)
        entry: uv run --no-sync black --config .black.toml quri-vm
        language: system
        types: [python]
        pass_filenames: false
      - id: docformatter-quri-algo
        name: uv run --no-sync docformatter (quri-algo)
        entry: uv run --no-sync docformatter -r -i quri-algo
        language: system
        types: [python]
        pass_filenames: false
      - id: docformatter-quri-parts
        name: uv run --no-sync docformatter (quri-parts)
        entry: uv run --no-sync docformatter -r -i quri-parts/packages
        language: system
        types: [python]
        pass_filenames: false
      - id: rustfmt-quri-parts
        name: cargo fmt --all --check (quri-parts)
        entry: bash -lc 'cd quri-parts && cargo fmt --all -- --check'
        language: system
        pass_filenames: false
      - id: flake8-quri-algo
        name: uv run --no-sync flake8 (quri-algo)
        entry: uv run --no-sync flake8 quri-algo --show-source
        language: system
        types: [python]
        pass_filenames: false
      - id: flake8-quri-parts
        name: uv run --no-sync flake8 (quri-parts)
        entry: uv run --no-sync flake8 quri-parts/packages --config .flake8
        language: system
        types: [python]
        pass_filenames: false
      - id: flake8-quri-vm
        name: uv run --no-sync flake8 (quri-vm)
        entry: uv run --no-sync flake8 quri-vm --config .flake8
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy-quri-vm
        name: uv run --no-sync mypy (quri-vm)
        entry: uv run --no-sync mypy quri-vm
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy-quri-algo
        name: uv run --no-sync mypy (quri-algo)
        entry: uv run --no-sync mypy quri-algo/quri_algo/ quri-algo/tests
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy-quri-parts
        name: uv run --no-sync mypy (quri-parts)
        entry: uv run --no-sync mypy quri-parts
        language: system
        types: [python]
        pass_filenames: false
