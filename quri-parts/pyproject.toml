[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "quri-parts"
dynamic = ["version"]
description = "Platform-independent quantum computing library"
license = "Apache-2.0"
authors = [{ name = "QURI Parts Authors", email = "opensource@qunasys.com" }]
readme = "README.md"
keywords = ["quantum", "quantum computing"]
classifiers = ["Topic :: Scientific/Engineering :: Physics", "Typing :: Typed"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "quri-parts-rust",
    "quri-parts-core",
    "quri-parts-circuit",
    "quri-parts-algo",
    "quri-parts-chem",
]

[project.urls]
Repository = "https://github.com/QunaSys/quri-parts"
Documentation = "https://quri-parts.qunasys.com"

[project.optional-dependencies]
qulacs = ["quri-parts-qulacs"]
braket = ["quri-parts-braket; python_version < '3.14'"]
qiskit = ["quri-parts-qiskit; python_version < '3.14'"]
cirq = ["quri-parts-cirq"]
openfermion = ["quri-parts-openfermion"]
stim = ["quri-parts-stim"]
openqasm = ["quri-parts-openqasm"]
quantinuum = ["quri-parts-quantinuum"]
ionq = ["quri-parts-ionq"]
itensor = ["quri-parts-itensor"]
pyscf = ["quri-parts-pyscf"]
tket = ["quri-parts-tket; python_version >= '3.10'"]
tensornetwork = ["quri-parts-tensornetwork"]
qsub = ["quri-parts-qsub; python_version >= '3.10'"]
qret = ["quri-parts-qret; python_version >= '3.10'"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
style = "pep440"
# Release CI bakes the resolved version in here before uv build so that
# sdists carry the correct version when built without git metadata.
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["quri_parts"]

[tool.hatch.build.targets.sdist]
only-include = ["quri_parts"]

[tool.uv.sources]
quri-parts-rust = { path = "packages/rust" }
quri-parts-core = { path = "packages/core", editable = true }
quri-parts-circuit = { path = "packages/circuit", editable = true }
quri-parts-algo = { path = "packages/algo", editable = true }
quri-parts-chem = { path = "packages/chem", editable = true }
quri-parts-qulacs = { path = "packages/qulacs", editable = true }
quri-parts-braket = { path = "packages/braket", editable = true }
quri-parts-qiskit = { path = "packages/qiskit", editable = true }
quri-parts-cirq = { path = "packages/cirq", editable = true }
quri-parts-openfermion = { path = "packages/openfermion", editable = true }
quri-parts-stim = { path = "packages/stim", editable = true }
quri-parts-openqasm = { path = "packages/openqasm", editable = true }
quri-parts-quantinuum = { path = "packages/quantinuum", editable = true }
quri-parts-ionq = { path = "packages/ionq", editable = true }
quri-parts-itensor = { path = "packages/itensor", editable = true }
quri-parts-pyscf = { path = "packages/pyscf", editable = true }
quri-parts-tensornetwork = { path = "packages/tensornetwork", editable = true }
quri-parts-tket = { path = "packages/tket", editable = true }
quri-parts-qsub = { path = "packages/qsub", editable = true }
quri-parts-qret = { path = "packages/qret", editable = true }
