[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "quri-parts-tensornetwork"
dynamic = ["version"]
description = "A plugin to use tensornetwork with QURI Parts"
license = "Apache-2.0"
authors = [{ name = "QURI Parts Authors", email = "opensource@qunasys.com" }]
readme = "README.md"
keywords = ["quantum", "quantum computing"]
classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed"
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "quri-parts-circuit",
    "quri-parts-core",
    "tensornetwork-ng>=0.5.1,<0.6.0",
    # tensorflow/jax/jaxlib were non-optional under poetry (the extras below
    # were no-ops); kept mandatory to preserve published metadata.
    # They have no cp314 wheels and are not imported by quri-parts
    # (tensornetwork-ng defaults to the NumPy backend); keep them on
    # Python <3.14 so the package itself still installs on 3.14.
    "tensorflow>=2.0,<3.0; python_version < '3.14'",
    "jax>=0.4,<0.5; python_version < '3.14'",
    "jaxlib>=0.4,<0.5; python_version < '3.14'",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.0,<3.0"]
jax = ["jax>=0.4,<0.5", "jaxlib>=0.4,<0.5"]

[project.urls]
Repository = "https://github.com/QunaSys/quri-sdk"
Documentation = "https://quri-parts.qunasys.com"

[dependency-groups]
dev = [
    "pytest>=7.0.1,<9.0.0",
    "numpy>=1.22.0",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
style = "pep440"
# Release CI bakes the resolved version in here before uv build so that
# sdists carry the correct version when built without git metadata.
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["quri_parts"]

[tool.hatch.build.targets.sdist]
only-include = ["quri_parts"]

[tool.uv.sources]
quri-parts-circuit = { path = "../circuit", editable = true }
quri-parts-core = { path = "../core", editable = true }

[tool.isort]
profile = "black"
