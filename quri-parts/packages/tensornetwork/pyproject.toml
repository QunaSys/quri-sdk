[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning", "setuptools"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
name = "quri-parts-tensornetwork"
version = "0.0.0"
description = "A plugin to use tensornetwork with QURI Parts"
license = "Apache-2.0"
authors = ["QURI Parts Authors <opensource@qunasys.com>"]
readme = "README.md"
repository = "https://github.com/QunaSys/quri-sdk"
documentation = "https://quri-parts.qunasys.com"
keywords = ["quantum", "quantum computing"]
classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed"
]
packages = [
    { include = "quri_parts" }
]

[tool.poetry-dynamic-versioning]
enable = true
style = "pep440"

[tool.poetry.dependencies]
python = "^3.9.8"
quri-parts-circuit = "*"
quri-parts-core = "*"
tensornetwork-ng = "^0.5.1"
# tensorflow/jax/jaxlib have no cp314 wheels and are not imported by
# quri-parts (tensornetwork-ng defaults to the NumPy backend); keep them on
# Python <3.14 so the package itself still installs on 3.14.
tensorflow = [{ version = "^2.0", python = "<3.14" }]
jax = [{ version = "^0.4", python = "<3.14" }]
jaxlib = [{ version = "^0.4", python = "<3.14" }]

[tool.poetry.extras]
tensorflow = ["tensorflow"]
jax = ["jax", "jaxlib"]

[tool.poetry.group.dev.dependencies]
quri-parts-circuit = {path = "../circuit", develop = true}
quri-parts-core = {path = "../core", develop = true}

pytest = "^7.0.1"
black = "^22.1.0"
flake8 = "^4.0.1"
mypy = ">=0.950"
docformatter = "^1.4"
isort = "^5.10.1"


[tool.black]
line-length = 88

[tool.isort]
profile = "black"

