[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "quri-parts-circuit"
dynamic = ["version"]
description = "Platform-independent quantum circuit library"
license = "Apache-2.0"
authors = [{ name = "QURI Parts Authors", email = "opensource@qunasys.com" }]
readme = "README.md"
keywords = ["quantum", "quantum computing"]
classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed"
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "typing-extensions>=4.1.1,<5.0.0",
    "numpy>=2.0",
    "mpmath>=1.3.0",
    "pygridsynth>=1.0.0",
    "quri-parts-rust",
]

[project.urls]
Repository = "https://github.com/QunaSys/quri-sdk"
Documentation = "https://quri-parts.qunasys.com"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
style = "pep440"
# Release CI bakes the resolved version in here before uv build so that
# sdists carry the correct version when built without git metadata.
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["quri_parts"]

[tool.hatch.build.targets.sdist]
only-include = ["quri_parts"]

[tool.uv.sources]
quri-parts-rust = { path = "../rust" }
