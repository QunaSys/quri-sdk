[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning", "setuptools"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
name = "quri-parts-circuit"
version = "0.0.0"
description = "Platform-independent quantum circuit library"
license = "Apache-2.0"
authors = ["QURI Parts Authors <opensource@qunasys.com>"]
readme = "README.md"
repository = "https://github.com/QunaSys/quri-sdk"
documentation = "https://quri-parts.qunasys.com"
keywords = ["quantum", "quantum computing"]
classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed"
]
packages = [
    { include = "quri_parts" }
]

[tool.poetry-dynamic-versioning]
enable = true
style = "pep440"

[tool.poetry.dependencies]
python = "^3.9.8"
typing-extensions = "^4.1.1"
# numpy 1.x has no cp313/cp314 wheel; pip source-builds it (MinGW on Windows) and that
# build segfaults on import. Require numpy 2 on Py>=3.13 (prebuilt wheels exist); stay on
# numpy <2.0 below (typecheck runs on Py3.10, so mypy is unaffected).
numpy = [
    { version = ">=2.1.0", markers = "python_version >= '3.13'" },
    { version = ">=1.22.0,<2.0", markers = "python_version < '3.13'" },
]
quri-parts-rust = "*"
