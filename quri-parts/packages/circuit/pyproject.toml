[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning", "setuptools"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
name = "quri-parts-circuit"
version = "0.0.0"
description = "Platform-independent quantum circuit library"
license = "Apache-2.0"
authors = ["QURI Parts Authors <opensource@qunasys.com>"]
readme = "README.md"
repository = "https://github.com/QunaSys/quri-sdk"
documentation = "https://quri-parts.qunasys.com"
keywords = ["quantum", "quantum computing"]
classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed"
]
packages = [
    { include = "quri_parts" }
]

[tool.poetry-dynamic-versioning]
enable = true
style = "pep440"

[tool.poetry.dependencies]
python = "^3.9.8"
typing-extensions = "^4.1.1"
# NumPy 2 dropped Python 3.9 (and 1.x has no cp313/cp314 wheels); pin <2 on
# Python <3.10 and require 2.x on 3.10+ so the lock forks instead of keeping a
# single 1.x that has no 3.13/3.14 wheels.
numpy = [
    { version = ">=1.22.0,<2.0", python = "<3.10" },
    { version = ">=2.0", python = ">=3.10" },
]
quri-parts-rust = "*"
# RZ2HSTTranspiler's default backend uses the pure-Python pygridsynth package.
mpmath = ">=1.3.0"
pygridsynth = ">=1.0.0"
