[package]
name = "quri-parts-rust"
version = "0.26.2"
edition = "2021"
publish = false

[dependencies]
num-complex = "0.4.6"
quri-parts = { path = "../../", version = "0.26.2", features = ["python"] }
rayon = "1.10"

[dependencies.pyo3]
version = "0.28"
features = ["extension-module", "macros", "num-complex", "py-clone"]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
