[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "quri-parts-qiskit"
dynamic = ["version"]
description = "A plugin to use Qiskit with QURI Parts"
license = "Apache-2.0"
authors = [{ name = "QURI Parts Authors", email = "opensource@qunasys.com" }]
readme = "README.md"
keywords = ["quantum", "quantum computing"]
classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed"
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy>=1.22.0",
    "quri-parts-circuit",
    "quri-parts-core",
    "pydantic>=2.0,<3.0",
    "networkx",
    # qiskit 1.x pulls symengine, which has no cp314 wheel; qiskit 2.2+ drops it
    # and supports 3.14. The code guards the removed BackendV1 so both work.
    "qiskit>=1.3.0,<2.0; python_version < '3.14'",
    "qiskit>=2.2.0,<3.0; python_version >= '3.14'",
    "qiskit-ibm-runtime>=0.29.0,<0.30.0; python_version < '3.14'",
    "qiskit-ibm-runtime>=0.47.0,<0.48.0; python_version >= '3.14'",
]

[project.urls]
Repository = "https://github.com/QunaSys/quri-sdk"
Documentation = "https://quri-parts.qunasys.com"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
style = "pep440"
# Release CI bakes the resolved version in here before uv build so that
# sdists carry the correct version when built without git metadata.
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["quri_parts"]

[tool.hatch.build.targets.sdist]
only-include = ["quri_parts"]

[tool.uv.sources]
quri-parts-circuit = { path = "../circuit", editable = true }
quri-parts-core = { path = "../core", editable = true }
