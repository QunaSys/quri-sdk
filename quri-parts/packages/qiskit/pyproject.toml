[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning", "setuptools"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
name = "quri-parts-qiskit"
version = "0.0.0"
description = "A plugin to use Qiskit with QURI Parts"
license = "Apache-2.0"
authors = ["QURI Parts Authors <opensource@qunasys.com>"]
readme = "README.md"
repository = "https://github.com/QunaSys/quri-sdk"
documentation = "https://quri-parts.qunasys.com"
keywords = ["quantum", "quantum computing"]
classifiers = ["Topic :: Scientific/Engineering :: Physics", "Typing :: Typed"]
packages = [{ include = "quri_parts" }]

[tool.poetry-dynamic-versioning]
enable = true
style = "pep440"

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.22.0"
quri-parts-circuit = "*"
quri-parts-core = "*"
pydantic = "^2.0"
networkx = "*"
# qiskit 1.x pulls symengine, which has no cp314 wheel; qiskit 2.2+ drops it
# and supports 3.14. The code guards the removed BackendV1 so both work.
qiskit = [
    { version = ">=1.3.0,<2.0", python = "<3.14" },
    { version = ">=2.2.0,<3.0", python = ">=3.14" },
]
qiskit-ibm-runtime = [
    { version = ">=0.29.0,<0.30.0", python = "<3.14" },
    { version = ">=0.47.0,<0.48.0", python = ">=3.14" },
]
