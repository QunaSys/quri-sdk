[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning", "setuptools"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
name = "quri-parts-pyscf"
version = "0.0.0"
description = "A plugin to use PySCF with QURI Parts"
license = "Apache-2.0"
authors = ["QURI Parts Authors <opensource@qunasys.com>"]
readme = "README.md"
repository = "https://github.com/QunaSys/quri-sdk"
documentation = "https://quri-parts.qunasys.com"
keywords = ["quantum", "quantum computing"]
classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed"
]
packages = [
    { include = "quri_parts" }
]

[tool.poetry-dynamic-versioning]
enable = true
style = "pep440"

[tool.poetry.dependencies]
python = "^3.9.8"
typing-extensions = "^4.1.1"
numpy = ">=1.22.0"
# pyscf 2.4.0+ ships a py3-none wheel (ctypes-loaded C libs) that works across
# 3.9-3.14; 2.3.x had no 3.14-compatible wheel.
pyscf = "^2.4.0"
quri-parts-core = "*"
quri-parts-chem = "*"
