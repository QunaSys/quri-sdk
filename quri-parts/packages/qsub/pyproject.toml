[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "quri-parts-qsub"
dynamic = ["version"]
description = "A support library for consturcting structured quantum circuits"
license = "Apache-2.0"
authors = [{ name = "QURI Parts Authors", email = "opensource@qunasys.com" }]
readme = "README.md"
keywords = ["quantum", "quantum computing"]
classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed"
]
requires-python = ">=3.10"
dependencies = [
    "quri-parts-circuit",
    "quri-parts-qulacs",
    "qulacsvis>=0.7.6,<0.8.0",
]

[project.urls]
Repository = "https://github.com/QunaSys/quri-sdk"
Documentation = "https://quri-parts.qunasys.com"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
style = "pep440"
# Release CI bakes the resolved version in here before uv build so that
# sdists carry the correct version when built without git metadata.
fallback-version = "0.0.0"

# quri_parts/qsub/lib/ matches the root .gitignore's "lib/" rule, so
# hatchling's VCS file selector drops it from the build (the .gitignore
# negation that rescues it for git is root-anchored and does not apply at
# the package build root). Force-include it so the wheel/sdist ship the
# runtime-imported quri_parts.qsub.lib subpackage.
[tool.hatch.build]
artifacts = ["quri_parts/qsub/lib/**"]

[tool.hatch.build.targets.wheel]
packages = ["quri_parts"]

[tool.hatch.build.targets.sdist]
only-include = ["quri_parts"]

[tool.uv.sources]
quri-parts-circuit = { path = "../circuit", editable = true }
quri-parts-qulacs = { path = "../qulacs", editable = true }
