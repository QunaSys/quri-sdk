name: QURI VM Lint

on:
  pull_request:
    paths:
      - quri-vm/**/*.py
      - quri-vm/pyproject.toml
      - quri-vm/.flake8
      - pyproject.toml
      - uv.lock
      - .github/workflows/quri-vm-lint.yml
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.10'

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: "0.11.17"
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: |
        uv sync --locked --group lint --group typecheck

    - name: Run isort
      run: uv run --no-sync isort quri-vm --check --diff
      if: success() || failure()

    - name: Run black
      run: uv run --no-sync black --config .black.toml quri-vm --check
      if: success() || failure()

    - name: Run flake8
      run: uv run --no-sync flake8 quri-vm --config .flake8
      if: success() || failure()

    - name: Run mypy
      run: uv run --no-sync mypy quri-vm
      if: success() || failure()
