name: QURI Parts Type check

on:
  pull_request:
    paths:
      - quri-parts/packages/**/*.py
      - quri-parts/mypy.ini
      - quri-parts/pyproject.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/quri-parts-typecheck.yml
  push:
    branches: [main]

jobs:
  typecheck:

    strategy:
      matrix:
        python_version:
          - '3.10'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: "0.11.17"
        python-version: ${{ matrix.python_version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --locked --group typecheck

    - name: Cache mypy cache
      uses: actions/cache@v4
      with:
        path: quri-parts/.mypy_cache
        key: mypy-${{ runner.os }}-${{ matrix.python_version }}-${{ hashFiles('quri-parts/**/*.py') }}
        restore-keys: |
          mypy-${{ runner.os }}-${{ matrix.python_version }}-

    - name: Run mypy
      run: uv run --no-sync mypy quri-parts
      if: success() || failure()
