name: QURI Algo Lint

on:
  pull_request:
    paths:
      - quri-algo/**.py
      - quri-algo/pyproject.toml
      - quri-algo/.flake8
      - pyproject.toml
      - uv.lock
      - .flake8-docstrings
      - .github/workflows/quri-algo-lint.yml
  push:
    branches: [main]


jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.10'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: "0.11.17"
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --locked --only-group lint --only-group docstring-check

    - name: Run isort
      run: uv run --no-sync isort quri-algo/quri_algo --check --diff
      if: success() || failure()

    - name: Run black
      run: uv run --no-sync black --config .black.toml quri-algo/quri_algo --check
      if: success() || failure()

    - name: Run flake8
      run: uv run --no-sync flake8 quri-algo/quri_algo --show-source
      if: success() || failure()

    - name: Run docformatter
      run: uv run --no-sync docformatter -c -r quri-algo/quri_algo
      if: success() || failure()

    # Only new/changed files, not the whole tree: the existing docstring
    # backlog isn't cleared yet. Separate docstring-check group + isolated
    # config so this doesn't leak D-codes into the flake8 step above.
    - name: Warn about missing docstrings in changed files
      if: (success() || failure()) && github.event_name == 'pull_request'
      run: |
        git diff --name-only -z --diff-filter=ACMR \
          HEAD^1 HEAD \
          -- 'quri-algo/quri_algo/**.py' 'quri-algo/tests/**.py' \
          | xargs -0 --no-run-if-empty uv run --no-sync flake8 --config=.flake8-docstrings \
              --exit-zero \
              --format='::warning file=%(path)s,line=%(row)d,col=%(col)d,title=Docstring check::%(code)s %(text)s'
