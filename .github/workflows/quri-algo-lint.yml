name: QURI Algo Lint

on:
  pull_request:
    paths:
      - quri-algo/**.py
      - quri-algo/pyproject.toml
      - quri-algo/.flake8
      - pyproject.toml
      - uv.lock
      - .github/workflows/quri-algo-lint.yml
  push:
    branches: [main]


jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.10'

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: "0.11.17"
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --locked --only-group lint

    - name: Run isort
      run: uv run --no-sync isort quri-algo/quri_algo --check --diff
      if: success() || failure()

    - name: Run black
      run: uv run --no-sync black --config .black.toml quri-algo/quri_algo --check
      if: success() || failure()

    - name: Run flake8
      run: uv run --no-sync flake8 quri-algo/quri_algo --show-source
      if: success() || failure()

    - name: Run docformatter
      run: uv run --no-sync docformatter -c -r quri-algo/quri_algo
      if: success() || failure()
