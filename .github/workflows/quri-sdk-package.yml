name: QURI SDK Package and release

on:
  push:
    branches: [main, 'quri-parts-qret*']
  release:
    types: [published]

jobs:
  pre-check:
    name: 🔎 Check project versions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
    - uses: actions/checkout@v3
      with:
        # Necessary to get tags for correct versioning
        fetch-depth: 0

    - name: check manual versioning
      shell: bash
      run: |
        GIT_VERSION_TAG="$(git describe --tags --abbrev=0 | head -n 1)"

        # process pyproject.toml files
        for FILE in $(find . -name "pyproject.toml"); do
          PYPROJECT_VERSION="$(sed -ne 's/version = "\(.*\)"$/\1/p' "$FILE" | head -n 1)"
          if [[ ! "$PYPROJECT_VERSION" = "0.0.0" && ! "v$PYPROJECT_VERSION" = $GIT_VERSION_TAG ]]; then
            echo "Version mismatch in $FILE; #PYPROJECT_VERSION != $GIT_VERSION_TAG" 1>&2
            false
          fi
        done

        # process Cargo.toml files
        for FILE in $(find . -name "Cargo.toml"); do
          CARGO_VERSION="$(sed -ne 's/version = "\(.*\)"$/\1/p' "$FILE" | head -n 1)"
          if [[ ! "v$CARGO_VERSION" = $GIT_VERSION_TAG ]]; then
            echo "Version mismatch in $FILE; #CARGO_VERSION != $GIT_VERSION_TAG" 1>&2
            false
          fi
        done

        echo "Version check finished successfully." 1>&2

  rust-sdist-package:
    name: 🔨📦 Rust sdist
    needs: [pre-check]
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: quri-parts
    steps:
      - name: Cache Poetry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-cache-${{ runner.os }}-3.11
      - name: Cache Packages
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-local-${{ runner.os }}-3.11

      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - run: |
          poetry env use 3.11
          mkdir -p dist
          poetry run pip install --upgrade build
          source $VENV

          # For sdist generation, only files under `packages/rust` or `rust` are needed.
          # To prevent errors, we remove some files of `quri-parts` package.
          rm -rf README.md pyproject.toml quri_parts docs
          mv packages/rust/pyproject.toml .
          mv packages/rust/quri_parts .
          mv packages/rust/MANIFEST.in .
          rm -rf packages/algo packages/braket packages/chem packages/circuit packages/cirq packages/core packages/ionq packages/itensor packages/openfermion packages/openqasm packages/pyscf packages/qiskit packages/quantinuum packages/qulacs packages/stim packages/tket packages/qsub packages/qret packages/tensornetwork
          echo 'path = "packages/rust/Cargo.toml"' >> pyproject.toml
          poetry run python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: quri-parts-packages-rust-sdist
          path: quri-parts/dist/*
          if-no-files-found: error
          overwrite: true

  test-rust-sdist-package:
    name: ▶️📦 sdist-${{matrix.system.os}}-3${{matrix.python-version}}
    needs: [rust-sdist-package, quri-parts-python-package]
    runs-on: ${{matrix.system.os}}
    strategy:
      fail-fast: false
      matrix:
        system:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
          - os: "macos-15-intel"
            target: "x86_64-apple-darwin"
          - os: "macos-latest"
            target: "aarch64-apple-darwin"
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
        python-version: [ "9", "11", "14" ]
        # Currently, qulacsvis does not support Python3.14&&Windows environment (ref: Qulacs-Osaka/qulacs-visualizer#138)
        exclude:
          - python-version: "14"
            system:
              os: "windows-latest"
    defaults:
      run:
        shell: bash
    env:
      # Needed to avoid format error in Windows
      PYTHONUTF8: "1"
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-v2-${{ runner.os }}-py${{ matrix.python-version }}
          
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: quri-parts-packages-rust-sdist
          path: quri-parts/dist

      - uses: actions/download-artifact@v4
        with:
          name: quri-parts-packages-python
          path: quri-parts/dist

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: 3.${{matrix.python-version}}

      - name: Install boost
        if: matrix.python-version == '14' || (matrix.python-version == '13' && runner.os == 'Windows')
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          # this version required to build qulacs
          boost_version: 1.83.0

      # required to build llvmlite<0.47,>=0.46.0dev0 (from numba->amazon-braket-default-simulator>=1.32.0->amazon-braket-sdk<2.0.0,>=1.25.1->quri-parts-braket==0.24.1.post53.dev0+08826f24)
      - name: Install LLVM
        if: runner.os == 'macOS' && (matrix.python-version == '10' || matrix.python-version == '11' || matrix.python-version == '12' || matrix.python-version == '13')
        run: |
          brew install llvm@20
          LLVM_PREFIX="$(brew --prefix llvm@20)"
          export LLVM_DIR=${LLVM_PREFIX}/lib/cmake/llvm
          echo "LLVM_DIR=${LLVM_PREFIX}/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "setuptools<72" > /tmp/llvmlite-constraints.txt
          PIP_CONSTRAINT=/tmp/llvmlite-constraints.txt pip install llvmlite==0.46.0

      - name: Install vcpkg
        if: runner.os == 'Windows' && matrix.python-version == '14'
        run: |
          git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          "$VCPKG_ROOT\bootstrap-vcpkg.bat"

      # required to build pillow>=8 (from matplotlib~=3.8->cirq-core<2.0.0,>=1.0.0->quri-parts-cirq==0.24.1.post53.dev0+08826f24)
      - name: Install zlib via vcpkg
        if: runner.os == 'Windows' && matrix.python-version == '14'
        run: |
          "$VCPKG_ROOT\vcpkg.exe" install zlib

      - name: Install packages
        env:
          BOOST_ROOT: ${{steps.install-boost.outputs.BOOST_ROOT}}
        shell: bash
        run: |
          pip install --upgrade pytest setuptools
          if [[ "${{ runner.os }}" = "Windows" ]]; then
              pip cache purge || true
          fi
          if [[ "${{ runner.os }}" = "Linux" ]]; then
              sudo apt install -y libjpeg-dev
          fi
          for FILE in $(find quri-parts/dist -name '*.tar.gz'); do
            if [[ "${{ matrix.system.os }}" == "windows-latest" ]]; then
              if [[ "$FILE" = *"quri_parts_pyscf"* || "$FILE" = *"quri_parts_itensor"* ]]; then
                # We cannot run tests on native Windows, since pyscf does not support it.
                continue
              fi
            fi
            if [[ "3.${{matrix.python-version}}" = "3.9" && "$FILE" = *"quri_parts_tket"* ]]; then
              continue
            fi
            if [[ "3.${{matrix.python-version}}" = "3.9" && "$FILE" = *"quri_parts_qsub"* ]]; then
              continue
            fi
            if [[ "3.${{matrix.python-version}}" = "3.9" && "$FILE" = *"quri_parts_qret"* ]]; then
              continue
            fi
            if [[ "3.${{matrix.python-version}}" = "3.14" && "$FILE" = *"quri_parts_braket"* ]]; then
              continue
            fi
            if [[ "3.${{matrix.python-version}}" = "3.14" && "$FILE" = *"quri_parts_qiskit"* ]]; then
              continue
            fi
            pip install -v $FILE
          done

      - name: Run test
        shell: bash
        run: |
          if [[ "${{ matrix.system.os }}" == "windows-latest" ]]; then
            if [[ "${{ matrix.python-version }}" = "14" ]]; then
              pytest quri-parts/packages --ignore=quri-parts/packages/{braket,pyscf,itensor,qiskit}
            else
              pytest quri-parts/packages --ignore=quri-parts/packages/{pyscf,itensor}
            fi
          elif [[ "${{ matrix.python-version }}" = "14" ]]; then
            pytest quri-parts/packages --ignore=quri-parts/packages/{braket,qiskit}
          else
            pytest quri-parts/packages
          fi

  rust-wheel-package:
    name: 🔨📦 Rust wheel (on ${{matrix.system.os}})
    needs: [pre-check]
    runs-on: ${{matrix.system.os}}
    strategy:
      fail-fast: false
      matrix:
        system:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
          - os: "macos-15-intel"
            target: "x86_64-apple-darwin"
          - os: "macos-latest"
            target: "aarch64-apple-darwin"
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
    defaults:
      run:
        shell: bash
        working-directory: quri-parts
    env:
      # Needed to avoid format error in Windows
      PYTHONUTF8: "1"
    steps:
      - name: Cache Poetry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-cache-${{ runner.os }}-3.11
      - name: Cache Packages
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-local-${{ runner.os }}-3.11

      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: 3.11

      - run: python -m pip install --upgrade pip build

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - if: runner.os != 'Linux'
        run: |
          mkdir -p dist
          pip install -v --upgrade pip build
          for pkg in packages/*
          do
            if [[ -e "$pkg/Cargo.toml" ]]; then
              cd "$pkg"
              python -c "import sys; import platform; print('sys_platform =', sys.platform, ', platform_machine =', platform.machine())"
              python -m pip wheel --config-settings=--build-option=--py-limited-api=cp39 --no-deps -v -w ../../dist .
              cd ../..
            fi
          done
          ls dist

      - name: Build wheels
        if: runner.os == 'Linux'
        uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_MANYLINUX_I686_IMAGE: manylinux2014
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_BUILD: "cp311-manylinux_i686 cp311-manylinux_x86_64"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_ALL_LINUX: "yum install -y openssl-devel"
          CIBW_BEFORE_BUILD_LINUX: "pip3 install --upgrade keyrings.alt"
          CIBW_ARCHS_LINUX: "auto"
          CIBW_ENVIRONMENT: 'PATH="$PATH:$HOME/.cargo/bin"'
        with:
          package-dir: quri-parts/packages/rust
          output-dir: quri-parts/dist

      - uses: actions/upload-artifact@v4
        with:
          name: quri-parts-packages-rust-whl-${{matrix.system.target}}-abi3
          path: quri-parts/dist/*
          if-no-files-found: error
          overwrite: true

  test-rust-wheel-package:
    name: ▶️📦 wheel-${{matrix.system.os}}-3${{matrix.python-version}}
    needs: [rust-wheel-package, quri-parts-python-package]
    runs-on: ${{matrix.system.os}}
    strategy:
      fail-fast: false
      matrix:
        system:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
          - os: "macos-15-intel"
            target: "x86_64-apple-darwin"
          - os: "macos-latest"
            target: "aarch64-apple-darwin"
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
        python-version: [ "9", "10", "11", "12", "13", "14" ]
        # Currentl, qulacsvis does not support Python3.14&&Windows environment (ref: Qulacs-Osaka/qulacs-visualizer#138)
        exclude:
          - python-version: "14"
            system:
              os: "windows-latest"
    defaults:
      run:
        shell: bash
    env:
      # Needed to avoid format error in Windows
      PYTHONUTF8: "1"
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-v2-${{ runner.os }}-py${{ matrix.python-version }}

      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: quri-parts-packages-rust-whl-${{matrix.system.target}}-abi3
          path: quri-parts/dist

      - uses: actions/download-artifact@v4
        with:
          name: quri-parts-packages-python
          path: quri-parts/dist_py

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: 3.${{matrix.python-version}}

      - name: Install boost
        if: matrix.python-version == '14' || (matrix.python-version == '13' && runner.os == 'Windows')
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          # this version required to build qulacs
          boost_version: 1.83.0

      # required to build llvmlite<0.47,>=0.46.0dev0 (from numba->amazon-braket-default-simulator>=1.32.0->amazon-braket-sdk<2.0.0,>=1.25.1->quri-parts-braket==0.24.1.post53.dev0+08826f24)
      - name: Install LLVM
        if: runner.os == 'macOS' && (matrix.python-version == '10' || matrix.python-version == '11' || matrix.python-version == '12' || matrix.python-version == '13')
        run: |
          brew install llvm@20
          LLVM_PREFIX="$(brew --prefix llvm@20)"
          export LLVM_DIR=${LLVM_PREFIX}/lib/cmake/llvm
          echo "LLVM_DIR=${LLVM_PREFIX}/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "setuptools<72" > /tmp/llvmlite-constraints.txt
          PIP_CONSTRAINT=/tmp/llvmlite-constraints.txt pip install llvmlite==0.46.0

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        if: runner.os == 'Windows' && matrix.python-version == '14'
        with:
          doNotCache: false

      # required to build pillow>=8 (from matplotlib~=3.8->cirq-core<2.0.0,>=1.0.0->quri-parts-cirq==0.24.1.post53.dev0+08826f24)
      - name: Install zlib via vcpkg
        if: runner.os == 'Windows' && matrix.python-version == '14'
        run: vcpkg install zlib

      - name: Install packages
        env:
          BOOST_ROOT: ${{steps.install-boost.outputs.BOOST_ROOT}}
        shell: bash
        run: |
          pip install pytest
          if [[ "${{ runner.os }}" = "Windows" ]]; then
              pip cache purge || true
          fi
          if [[ "${{ runner.os }}" = "Linux" ]]; then
              sudo apt install -y libjpeg-dev
          fi
          if [[ "${{ runner.os }}" = "Linux" ]]; then
              pip install quri-parts/dist/quri_parts*.manylinux2014_x86_64.whl
          else
            for FILE in "$(find quri-parts/dist -name 'quri_parts*.whl')"; do
              pip install -v $FILE
            done
          fi
          for FILE in $(find quri-parts/dist_py -name '*.whl'); do
            if [[ "${{ matrix.system.os }}" == "windows-latest" ]]; then
              if [[ "$FILE" = *"quri_parts_pyscf"* || "$FILE" = *"quri_parts_itensor"* ]]; then
                # We cannot run tests on native Windows, since pyscf does not support it.
                continue
              fi
            fi
            if [[ "3.${{matrix.python-version}}" = "3.9" && "$FILE" = *"quri_parts_tket"* ]]; then
              continue
            fi
            if [[ "3.${{matrix.python-version}}" = "3.9" && "$FILE" = *"quri_parts_qsub"* ]]; then
              continue
            fi
            if [[ "3.${{matrix.python-version}}" = "3.9" && "$FILE" = *"quri_parts_qret"* ]]; then
              continue
            fi
            if [[ "3.${{matrix.python-version}}" = "3.14" && "$FILE" = *"quri_parts_braket"* ]]; then
              continue
            fi
            if [[ "3.${{matrix.python-version}}" = "3.14" && "$FILE" = *"quri_parts_qiskit"* ]]; then
              continue
            fi
            pip install -v $FILE
          done

      - name: Run test
        shell: bash
        run: |
          if [[ "${{ matrix.system.os }}" == "windows-latest" ]]; then
            if [[ "${{ matrix.python-version }}" = "14" ]]; then
              pytest quri-parts/packages --ignore=quri-parts/packages/{braket,pyscf,itensor,qiskit}
            else
              pytest quri-parts/packages --ignore=quri-parts/packages/{pyscf,itensor}
            fi
          elif [[ "${{ matrix.python-version }}" = "14" ]]; then
            pytest quri-parts/packages --ignore=quri-parts/packages/{braket,qiskit}
          else
            pytest quri-parts/packages
          fi

  quri-parts-python-package:
    name: 🔨📦 QURI Parts python packages
    needs: [pre-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quri-parts

    steps:
    - uses: actions/checkout@v3
      with:
        # Necessary to get tags for correct versioning
        fetch-depth: 0

    - uses: ./.github/actions/quri-parts/python-poetry-install
      with:
        poetry-version: '1.4.0'
        python-version: '3.10'

    - shell: bash
      run: |
        pip install setuptools
        poetry env use 3.10
        poetry self add setuptools
        poetry self add "poetry-dynamic-versioning[plugin]"
        mkdir -p dist
        cp -f NOTICE quri_parts/
        poetry build
        cd packages
        for pkg in *
        do
          cd $pkg
          if [[ ! -e "Cargo.toml" ]]; then
            cp -f NOTICE quri_parts/$pkg/
            poetry build
            mv dist/* ../../dist
          fi
          cd ..
        done

    - uses: actions/upload-artifact@v4
      with:
        name: quri-parts-packages-python
        path: quri-parts/dist/*
        if-no-files-found: error
        overwrite: true

  merge-quri-parts:
    name: 🔨📦 QURI Parts
    needs: [quri-parts-python-package, test-rust-wheel-package, test-rust-sdist-package]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quri-parts
    steps:
      - name: Merge QURI Parts Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: quri-sdk-quri-parts
          pattern: quri-parts-packages-*

  release-quri-parts:
    name: 🕊️ Release QURI Parts
    needs: merge-quri-parts
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quri-sdk-quri-parts

      - name: Install Twine
        run: python -m pip install twine==6.1.0 packaging==24.2

      - name: Release to PyPI
        run: |
          COUNTER=0
          for f in *; do
            echo "Checking $f"
            if ! python -m twine check $f; then
              COUNTER=$((COUNTER + 1))
            fi
          done
          [[ $COUNTER = 0 ]] && python -m twine upload *
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.TWINE_API_TOKEN }}

  quri-algo-package:
    name: 🔨📦 QURI Algo
    runs-on: ubuntu-latest
    needs: pre-check
    defaults:
      run:
        working-directory: quri-algo

    steps:
    - uses: actions/checkout@v3
      with:
        # Necessary to get tags for correct versioning
        fetch-depth: 0

    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - uses: ./.github/actions/quri-algo/setup

    - run: |
        poetry self add "poetry-dynamic-versioning[plugin]"

    - run: |
        poetry env use python3.11
        poetry build

    - uses: actions/upload-artifact@v4
      with:
        name: quri-sdk-quri-algo
        path: quri-algo/dist/*
        if-no-files-found: error
        overwrite: true

  release-quri-algo:
    name: 🕊️ Release QURI Algo
    needs: [quri-algo-package]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: quri-sdk-quri-algo

    - name: Install Twine
      run: python -m pip install twine

    - name: Release to PyPI
      run: python -m twine upload *
      env:
        TWINE_USERNAME: "__token__"
        TWINE_PASSWORD: ${{ secrets.TWINE_API_TOKEN }}

  quri-vm-package:
    name: 🔨📦 QURI VM
    runs-on: ubuntu-latest
    needs: pre-check
    defaults:
      run:
        working-directory: quri-vm

    steps:
    - uses: actions/checkout@v3
      with:
        # Necessary to get tags for correct versioning
        fetch-depth: 0

    - uses: ./.github/actions/quri-vm/setup
      with:
        poetry-version: '1.8.0'
        python-version: '3.10'

    - run: |
        poetry self add "poetry-dynamic-versioning[plugin]"

    - run: |
        poetry env use 3.10
        poetry build

    - uses: actions/upload-artifact@v4
      with:
        name: quri-sdk-quri-vm
        path: quri-vm/dist/*
        if-no-files-found: error

  release-quri-vm:
    name: 🕊️ Release QURI VM
    needs: [quri-vm-package]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: quri-sdk-quri-vm

    - name: Install Twine
      run: python -m pip install twine

    - name: Release to PyPI
      run: python -m twine upload *
      env:
        TWINE_USERNAME: "__token__"
        TWINE_PASSWORD: ${{ secrets.TWINE_API_TOKEN }}

  quri-sdk-meta-package:
    name: 🔨📦 QURI SDK meta
    needs: pre-check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        # Necessary to get tags for correct versioning
        fetch-depth: 0

    - uses: ./.github/actions/python-poetry-install
      with:
        poetry-version: '1.4.0'
        python-version: '3.10'

    - shell: bash
      run: |
        pip install setuptools
        poetry env use 3.10
        poetry self add setuptools
        poetry self add "poetry-dynamic-versioning[plugin]"
        mkdir -p dist
        poetry build

    - uses: actions/upload-artifact@v4
      with:
        name: quri-sdk-meta
        path: dist/*
        if-no-files-found: error
        overwrite: true

  merge-quri-sdk:
    name: 🔨📦 QURI SDK
    needs: [merge-quri-parts, quri-algo-package, quri-vm-package, quri-sdk-meta-package]
    runs-on: ubuntu-latest
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: quri-sdk
          pattern: quri-sdk-*

  release-quri-sdk:
    name: 🕊️ Release QURI SDK
    needs: merge-quri-sdk
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quri-sdk

      - name: Install Twine
        run: python -m pip install twine==6.1.0 packaging==24.2

      - name: Release to PyPI
        run: |
          COUNTER=0
          for f in *; do
            echo "Checking $f"
            if ! python -m twine check $f; then
              COUNTER=$((COUNTER + 1))
            fi
          done
          [[ $COUNTER = 0 ]] && python -m twine upload *
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.TWINE_API_TOKEN }}
