name: QURI Parts QRET Test

on:
  pull_request:
    paths:
      - quri-parts/packages/qret/**
      - quri-parts/packages/qsub/**
      - quri-parts/packages/core/**
      - quri-parts/packages/circuit/**
      - .github/workflows/quri-parts-qret-test.yml
  push:
    branches: [main]

jobs:
  test-qret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install bundled qret package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          unzip -q .github/workflows/pyqret-wheel-ubuntu-latest-py3.10.zip -d qret-artifact
          for file in $(find qret-artifact -name "*.whl"); do
            python -m pip install "$file"
          done
          for file in $(find qret-artifact -name "*.tar.gz"); do
            python -m pip install "$file"
          done

      - name: Install quri-parts-qret and deps
        env:
          POETRY_DYNAMIC_VERSIONING_BYPASS: "1"
        shell: bash
        run: |
          python -m pip install poetry-dynamic-versioning pytest isort black docformatter mypy flake8
          python -m pip install -e quri-parts/packages/core
          python -m pip install -e quri-parts/packages/circuit
          python -m pip install -e quri-parts/packages/qsub
          python -m pip install -e quri-parts/packages/qret

      - run: python -m isort --check-only quri-parts/packages/qret
        shell: bash
        if: success() || failure()
      - run: python -m black --check quri-parts/packages/qret
        shell: bash
        if: success() || failure()
      - run: python -m docformatter -c -r quri-parts/packages/qret
        shell: bash
        if: success() || failure()
      - run: python -m flake8 quri-parts/packages/qret --config .flake8
        shell: bash
        if: success() || failure()
      - run: python -m mypy quri-parts/packages/qret --config-file mypy.ini
        shell: bash
        if: success() || failure()

      - name: Run qret tests
        run: python -m pytest quri-parts/packages/qret/tests
