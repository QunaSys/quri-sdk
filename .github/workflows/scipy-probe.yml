name: scipy probe (throwaway)

on:
  workflow_dispatch:
  push:
    branches: ['**scipy-probe**']

jobs:
  probe:
    name: numpy ${{ matrix.numpy }} on win/py3.13
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy>=2.1 -> prebuilt cp313 wheel (expected OK); numpy<2.0 -> MinGW source build (expected segfault)
        numpy: [">=2.1.0", ">=1.22.0,<2.0"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - shell: bash
        run: |
          python -m pip install --upgrade pip
          # scipy unconstrained; the variable under test is the numpy version
          pip install "numpy${{ matrix.numpy }}" scipy
          pip list | grep -iE "numpy|scipy"
          python -c "import scipy.stats, numpy; print('OK', 'scipy', scipy.__version__, 'numpy', numpy.__version__)"
