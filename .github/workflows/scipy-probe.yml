name: scipy probe (throwaway)

on:
  workflow_dispatch:
  push:
    branches: ['**scipy-probe**']

jobs:
  probe:
    name: ${{ matrix.dep }} +numpy2 on win/py3.13
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # do these transitive deps keep numpy >=2.1 (prebuilt wheel) on py3.13, or force a 1.x source build?
        dep: ["amazon-braket-sdk", "cirq-core", "cirq-core<1.4"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - shell: bash
        run: |
          python -m pip install --upgrade pip
          # force the surgical numpy floor, then add the dep; watch if numpy gets downgraded / source-built
          pip install "numpy>=2.1.0" "${{ matrix.dep }}" 2>&1 | grep -iE "Building wheel for numpy|Downloading numpy|Downloading cirq|Downloading numba|would result|conflict|ERROR" || true
          echo "--- resolved versions ---"
          pip list 2>/dev/null | grep -iE "^numpy|^scipy|^numba|^cirq-core" || true
          python -c "import numpy; print('numpy', numpy.__version__); import scipy.stats; print('scipy ok')"
