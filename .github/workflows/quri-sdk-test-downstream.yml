name: Test Downstream with PR Branch

on:
  pull_request:
    paths:
      - quri-algo/**/*.py
      - quri-algo/pyproject.toml
      - quri-vm/**/*.py
      - quri-vm/pyproject.toml
      - quri-parts/packages/**/*.py
      - quri-parts/packages/**/*.rs
      - quri-parts/./**/Cargo.toml
      - pyproject.toml
  push:
    branches: [main]

jobs:
  test-downstream:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get current branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_URL }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: downstream-repo
          submodules: recursive
      
      - name: Update submodule to current branch
        working-directory: downstream-repo
        run: |
          # Update the submodule to point to the current PR branch
          git submodule update --init --recursive
          cd path/to/submodule  # Replace with actual submodule path
          git fetch origin
          git checkout ${{ steps.branch.outputs.name }} || git checkout -b ${{ steps.branch.outputs.name }} origin/${{ steps.branch.outputs.name }}
          cd ..
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: downstream-repo/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Install dependencies
        working-directory: downstream-repo
        run: poetry install --no-interaction --no-root
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      
      - name: Install project
        working-directory: downstream-repo
        run: poetry install --no-interaction
      
      - name: Run tests with pytest
        working-directory: downstream-repo
        run: |
          poetry run pytest -v --tb=short
      
      - name: Report test results
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ All tests passed!"
          else
            echo "❌ Some tests failed!"
            exit 1
          fi