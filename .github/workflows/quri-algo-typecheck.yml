name: QURI Algo Typecheck

on:
  pull_request:
    paths:
      - quri-algo/quri_algo/**/*.py
      - quri-algo/tests/**/*.py
      - quri-algo/mypy.ini
      - quri-algo/pyproject.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/quri-algo-typecheck.yml
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.10'

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: "0.11.17"
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --locked --group typecheck

    - name: Run mypy
      run: uv run --no-sync mypy quri-algo/tests/ quri-algo/quri_algo/
