name: QURI Parts Test

on:
  pull_request:
    paths:
      - quri-parts/packages/**/*.py
      - quri-parts/packages/**/*.rs
      - quri-parts/./**/Cargo.toml
      - quri-parts/./**/Cargo.lock
      - quri-parts/rust/**/*.rs
      - quri-parts/**/*.jl
      - quri-parts/pyproject.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/quri-parts-test.yml
      - .github/actions/quri-parts/rust-install-cache/action.yml
  push:
    branches: [main]


jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        python_version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: "0.11.17"
        python-version: ${{ matrix.python_version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - uses: ./.github/actions/quri-parts/rust-install-cache
      with:
        toolchain: "stable"
        additional-key: "test"

    - uses: actions/cache@v4
      with:
        path: |
          ~/.julia/
        key: ci-${{ runner.os }}-julia-${{ hashFiles('uv.lock') }}-cache
        restore-keys: ci-${{ runner.os }}-julia-

    - name: Run Rust tests
      working-directory: quri-parts
      run: cargo test --workspace

    - name: Install dependencies
      if: matrix.python_version != '3.14'
      run: |
        uv sync --locked

    # On 3.14 the only deps without cp314 wheels are tensorflow/jax/jaxlib (via
    # tensornetwork); they carry `python_version < '3.14'` markers and drop from
    # the locked closure, so `uv sync --locked` resolves exactly like the other
    # legs (same numpy 2.4.6 and braket set, no constraints workaround). Two
    # transitive deps build from sdist here: qulacs (a hard dep of
    # quri-parts-core) needs CMake + Boost, and Pillow 10.x (capped <11 by
    # qulacsvis, so no cp314 wheel) needs zlib + libjpeg.
    - name: Install dependencies (3.14)
      if: matrix.python_version == '3.14'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake libboost-dev zlib1g-dev libjpeg-dev
        uv sync --locked

    # The following steps activate the venv instead of using `uv run`.
    - name: Detect Julia project
      id: julia_project
      run: |
        source .venv/bin/activate
        python -c "import juliapkg; print('PROJECT={}'.format(juliapkg.project()))" | sed -ne '/^PROJECT=/p' >> "$GITHUB_OUTPUT"

    - name: Prepare Julia deps
      run: |
        source .venv/bin/activate
        julia  "--project=${{ steps.julia_project.outputs.PROJECT }}" -e 'using Pkg; Pkg.add("PythonCall"); Pkg.instantiate()'

    - name: Run pytest
      # gridsynth-marked tests use pygridsynth, which requires Python >= 3.10.
      run: |
        source .venv/bin/activate
        pytest quri-parts ${{ startsWith(matrix.python_version, '3.1') && '--with-gridsynth' || '' }}
