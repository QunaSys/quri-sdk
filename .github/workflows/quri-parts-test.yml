name: QURI Parts Test

on:
  pull_request:
    paths:
      - quri-parts/packages/**/*.py
      - quri-parts/packages/**/*.rs
      - quri-parts/./**/Cargo.toml
      - quri-parts/./**/Cargo.lock
      - quri-parts/rust/**/*.rs
      - quri-parts/**/*.jl
      - quri-parts/pyproject.toml
      - pyproject.toml
      - poetry.lock
      - .github/workflows/quri-parts-test.yml
      - .github/actions/python-poetry-install/action.yml
      - .github/actions/quri-parts/rust-install-cache/action.yml
  push:
    branches: [main]


jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        python_version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/python-poetry-install
      with:
        poetry-version: '1.8.5'
        python-version: ${{ matrix.python_version }}

    - name: Cache Poetry environment
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pypoetry
        key: poetry-${{ runner.os }}-py${{ matrix.python_version }}-quri-parts-test-${{ hashFiles('poetry.lock') }}

    - uses: ./.github/actions/quri-parts/rust-install-cache
      with:
        toolchain: "stable"
        additional-key: "test"

    - uses: actions/cache@v4
      with:
        path: |
          ~/.julia/
        key: ci-${{ runner.os }}-julia-${{ hashFiles('poetry.lock') }}-cache
        restore-keys: ci-${{ runner.os }}-julia-

    - name: Run Rust tests
      working-directory: quri-parts
      run: cargo test --workspace

    - name: Choose python version
      run: |
        poetry env use ${{ matrix.python_version }}
    - name: Install system build dependencies (3.14)
      if: matrix.python_version == '3.14'
      # On 3.14 some deps have no cp314 wheel and build from source: qulacs
      # (a hard transitive dep of core) needs CMake + Boost, and Pillow 10.x
      # (capped <11 by qulacsvis) needs zlib + libjpeg.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake libboost-dev zlib1g-dev libjpeg-dev
    - name: Install legacy dependency
      if: matrix.python_version == '3.9'
      # We need to provide older setuptools (<82) for building ibm-cloud-sdk-core and ibm-platfrom-services for Python 3.9
      # We cannot upgrade ibm-cloud-sdk-core or ibm-platform-services since they are constrainted from Python 3.9
      # More details: https://github.com/QunaSys/quri-sdk/pull/507
      run: |
        echo "setuptools<82" > /tmp/constraints.txt
        poetry run pip install -vvv "ibm-cloud-sdk-core==3.18.0" --build-constraint /tmp/constraints.txt
        poetry run pip install -vvv "ibm-platform-services==0.48.0" --build-constraint /tmp/constraints.txt
    - name: Install dependencies
      run: |
        poetry run pip install -vvv -e quri-parts/packages/rust
        poetry install -vvv --only main,dev

    - name: Detect Julia project
      id: julia_project
      run: |
        poetry run python -c "import juliapkg; print('PROJECT={}'.format(juliapkg.project()))" | sed -ne '/^PROJECT=/p' >> "$GITHUB_OUTPUT"

    - name: Prepare Julia deps
      run: |
        poetry run julia  "--project=${{ steps.julia_project.outputs.PROJECT }}" -e 'using Pkg; Pkg.add("PythonCall"); Pkg.instantiate()'

    - name: Run pytest
      # gridsynth-marked tests use pygridsynth, which requires Python >= 3.10;
      # enable them only on the 3.10 leg.
      run: >
        poetry run pytest quri-parts
        ${{ matrix.python_version == '3.10' && '--with-gridsynth' || '' }}
