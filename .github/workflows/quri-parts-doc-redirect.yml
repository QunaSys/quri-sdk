name: QURI Parts Doc Redirect

# The standalone QURI Parts doc sites are superseded by https://quri-sdk.qunasys.com:
#   - quri-parts.netlify.app, whose build workflow lived in this repository
#   - quri-parts.qunasys.com (CNAME to quri-parts-doc.netlify.app), built from the
#     dormant QunaSys/quri-parts-docusaurus repository
# Neither is rebuilt any more, so Netlify would keep serving the last deploy of each
# forever. Publish a redirect page over both to keep existing links working. The
# quri-parts-doc deploy lives here rather than in quri-parts-docusaurus because that
# repository is being archived, and archived repositories cannot run workflows.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/quri-parts-doc-redirect.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: quri-parts-doc-redirect
  cancel-in-progress: false

jobs:
  deploy-redirect:
    if: github.repository == 'QunaSys/quri-sdk-internal'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        site:
          - c809dd00-1b20-41de-adc9-ad4c882d452d  # quri-parts.netlify.app
          - quri-parts-doc  # quri-parts.qunasys.com

    steps:
      - name: Build the redirect site
        run: |
          mkdir -p redirect-site
          cat > redirect-site/_redirects <<'EOF'
          /*  https://quri-sdk.qunasys.com/:splat  301!
          EOF
          cat > redirect-site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>QURI Parts documentation has moved</title>
              <link rel="canonical" href="https://quri-sdk.qunasys.com" />
              <meta http-equiv="refresh" content="0; url=https://quri-sdk.qunasys.com" />
            </head>
            <body>
              <p>
                The QURI Parts documentation now lives at
                <a href="https://quri-sdk.qunasys.com">https://quri-sdk.qunasys.com</a>.
              </p>
            </body>
          </html>
          EOF

      - name: Verify Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "Missing Netlify auth token"; exit 1; }

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx -y netlify-cli@27.0.3 deploy --no-build --prod \
            --site "${{ matrix.site }}" \
            --dir redirect-site \
            --message "redirect to quri-sdk.qunasys.com @ ${{ github.sha }}"
