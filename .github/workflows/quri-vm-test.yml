name: QURI VM Test

on:
  pull_request:
    paths:
      - quri-vm/**/*.py
      - quri-vm/pyproject.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/quri-vm-test.yml
  push:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.10'

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: "0.11.17"
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --locked

    - name: Run pytest
      run: uv run --no-sync pytest quri-vm
